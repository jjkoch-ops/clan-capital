<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clan Capital</title>
<meta name="description" content="Track a South African family's income, spending, budget, investments and debt, for the whole household and each member.">
<style>
/* Intro screen. Inline so it paints instantly, before any other file loads.
   One deliberate deep-green look in both light and dark themes. */
:root { --splash-bg: #0b3a2c; --splash-ink: #eef5f1; --splash-gold: #e6bd5c; }
.splash {
  position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 24px 16px;
  background: radial-gradient(circle at 50% 40%, rgba(230, 189, 92, .14), transparent 58%), var(--splash-bg);
  color: var(--splash-ink); cursor: pointer; opacity: 1;
  font-family: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  will-change: opacity;
}
.splash-inner { display: grid; justify-items: center; text-align: center; gap: 10px; max-width: 520px; will-change: opacity, transform; }
.splash-mark { width: 76px; height: 76px; color: var(--splash-ink); margin-bottom: 6px; }
.splash-mark .bar { transform-origin: 50% 48px; transform-box: view-box; transform: scaleY(0); }
.splash-greet, .splash-name, .splash-figure, .splash-insight, .splash-skip { opacity: 0; }
.splash-greet { font-size: .95rem; letter-spacing: .04em; margin: 0; }
.splash-name { font-family: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif; font-weight: 650; font-size: clamp(2.4rem, 8vw, 3.6rem); letter-spacing: -0.02em; line-height: 1; margin: 0; color: var(--splash-ink); }
.splash-figure { display: grid; gap: 2px; margin-top: 14px; }
.splash-label { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; opacity: .7; }
.splash-value { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: clamp(1.6rem, 6vw, 2.2rem); color: var(--splash-gold); font-variant-numeric: tabular-nums; display: inline-block; text-align: right; white-space: pre; }
.splash-insight { font-size: .95rem; min-height: 1.4em; margin: 0; }
.splash-skip { font-size: .75rem; margin: 18px 0 0; }

/* Entrance: starts once fonts are ready, so nothing jumps */
.splash.go .bar { animation: sp-grow 1s cubic-bezier(.2, .8, .2, 1) forwards; }
.splash.go .b2 { animation-delay: .12s; } .splash.go .b3 { animation-delay: .24s; }
.splash.go .splash-greet   { animation: sp-up .9s cubic-bezier(.2, .8, .2, 1) .3s forwards; }
.splash.go .splash-name    { animation: sp-up .9s cubic-bezier(.2, .8, .2, 1) .45s forwards; }
.splash.go .splash-figure  { animation: sp-up .9s cubic-bezier(.2, .8, .2, 1) .75s forwards; }
.splash.go .splash-insight { animation: sp-up .9s cubic-bezier(.2, .8, .2, 1) 2.4s forwards; }
.splash.go .splash-skip    { animation: sp-fade .8s ease 1.4s forwards; }
@keyframes sp-grow { to { transform: scaleY(1); } }
@keyframes sp-up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes sp-fade { to { opacity: .45; } }

/* Exit: the content lifts and fades first, then the green dissolves over the app */
.splash.leave { opacity: 0; transition: opacity .8s cubic-bezier(.4, 0, .2, 1) .25s; pointer-events: none; }
.splash.leave .splash-inner { opacity: 0; transform: translateY(-14px); transition: opacity .45s ease, transform .6s cubic-bezier(.4, 0, .2, 1); }

@media (prefers-reduced-motion: reduce) {
  .splash.go .bar, .splash.go .splash-greet, .splash.go .splash-name, .splash.go .splash-figure, .splash.go .splash-insight, .splash.go .splash-skip { animation: sp-fade-full .4s ease forwards; }
  .splash.go .bar { transform: none; }
  .splash.leave .splash-inner { transform: none; }
  @keyframes sp-fade-full { from { opacity: 0; } to { opacity: 1; } }
}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="splash" class="splash" role="dialog" aria-label="Welcome to Clan Capital">
  <div class="splash-inner">
    <svg class="splash-mark" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="29" fill="none" stroke="currentColor" stroke-width="2.5" opacity=".35"/>
      <rect class="bar b1" x="17" y="34" width="8" height="14" rx="2" fill="currentColor"/>
      <rect class="bar b2" x="28" y="26" width="8" height="22" rx="2" fill="currentColor"/>
      <rect class="bar b3" x="39" y="17" width="8" height="31" rx="2" fill="var(--splash-gold)"/>
    </svg>
    <p class="splash-greet" id="splash-greet">Welcome</p>
    <h2 class="splash-name">Clan Capital</h2>
    <div class="splash-figure"><span class="splash-label">Family net worth</span><span class="splash-value" id="splash-value">R 0</span></div>
    <p class="splash-insight" id="splash-insight"></p>
    <p class="splash-skip">Tap or click to continue</p>
  </div>
</div>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <h1>Clan Capital</h1>
      <span class="household" id="household-name"></span>
    </div>
    <div class="member-filter" id="member-filter" role="group" aria-label="Show figures for"></div>
  </div>
  <nav class="tabs" aria-label="Sections">
    <div class="tabs-inner" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="overview">Overview</button>
      <button class="tab" role="tab" data-tab="money">Income &amp; spending</button>
      <button class="tab" role="tab" data-tab="budget">Budget</button>
      <button class="tab" role="tab" data-tab="investments">Investments</button>
      <button class="tab" role="tab" data-tab="goals">Goals</button>
      <button class="tab" role="tab" data-tab="debt">Debt</button>
      <button class="tab" role="tab" data-tab="data">Import &amp; settings</button>
    </div>
  </nav>
</header>

<main id="main">
  <div id="sample-banner"></div>
  <div id="view"></div>
  <p class="footer-note">Your figures stay in this browser. Nothing is uploaded to a server.</p>
</main>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="js/core.js"></script>
<script src="js/sample.js"></script>
<script src="js/planner.js"></script>
<script src="js/goals.js"></script>
<script src="js/app.js"></script>
</body>
</html>
